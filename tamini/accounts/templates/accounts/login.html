{% extends 'base.html' %}
{% load i18n static %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-orange-50 py-12 px-4">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-orange-100">
        <div>
            <h2 class="mt-6 text-center text-3xl font-lalezar text-orange-600">
                {% trans "تسجيل الدخول" %}
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600 font-cairo">
                {% trans "مرحباً بك مجدداً في طعميني" %}
            </p>
        </div>

        <!-- Google sign-in -->
        <div id="login-google-auth"></div>
        <div class="flex items-center gap-3 my-4">
            <span class="h-px bg-gray-200 flex-1"></span>
            <span class="text-xs text-gray-400">{% trans "أو" %}</span>
            <span class="h-px bg-gray-200 flex-1"></span>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200">
            <button type="button" id="tab-email"
                class="flex-1 pb-3 text-center font-bold text-sm border-b-2 transition-colors"
                style="border-color:#ea580c;color:#ea580c"
                onclick="switchLoginTab('email')">
                {% trans "البريد الإلكتروني" %}
            </button>
            <button type="button" id="tab-phone"
                class="flex-1 pb-3 text-center font-bold text-sm border-b-2 transition-colors"
                style="border-color:transparent;color:#9ca3af"
                onclick="switchLoginTab('phone')">
                {% trans "رقم الهاتف" %}
            </button>
        </div>

        <!-- Email login (Firebase) -->
        <div id="panel-email" class="mt-6">
            <div id="login-email-auth"></div>
        </div>

        <!-- Phone login (Firebase) -->
        <div id="panel-phone" class="hidden mt-6">
            <div id="login-phone-auth"></div>
        </div>

        <div class="text-center font-cairo text-sm">
            <p class="text-gray-600">{% trans "ليس لديك حساب؟" %} 
                <a href="{% url 'register' %}" class="font-bold text-orange-600 hover:text-orange-500">{% trans "إنشاء حساب جديد" %}</a>
            </p>
        </div>
    </div>
</div>

<script src="{% static 'js/firebase-auth.js' %}?v=7"></script>
<script>
(function(){
    var T_EMAIL = {
        emailLabel: "{% trans 'البريد الإلكتروني' %}",
        passwordLabel: "{% trans 'كلمة المرور' %}",
        signIn: "{% trans 'دخول' %}",
        enterEmailAndPassword: "{% trans 'الرجاء إدخال البريد الإلكتروني وكلمة المرور' %}",
        userNotFound: "{% trans 'الحساب غير موجود' %}",
        wrongPassword: "{% trans 'كلمة المرور غير صحيحة' %}",
        invalidEmail: "{% trans 'البريد الإلكتروني غير صحيح' %}",
        tooManyRequests: "{% trans 'لقد تجاوزت الحد المسموح. يرجى المحاولة لاحقاً' %}",
        genericError: "{% trans 'حدث خطأ. يرجى المحاولة مرة أخرى' %}",
        verifyTitle: "{% trans 'تم إرسال رابط التأكيد إلى بريدك الإلكتروني' %}",
        verifyHint: "{% trans 'افتح بريدك الإلكتروني واضغط على رابط التأكيد — سيتم إرجاعك تلقائياً إلى موقعنا لإكمال الدخول.' %}",
        verifyContinue: "{% trans 'متابعة' %}",
        verifyNotYet: "{% trans 'لم يتم تأكيد البريد بعد — اضغط الرابط داخل الرسالة ثم «متابعة».' %}",
        resendLink: "{% trans 'إعادة إرسال الرابط' %}",
        resentOk: "{% trans 'تم إرسال الرابط مرة أخرى إلى بريدك' %}",
    };
    var T_PHONE = {
        phoneEmpty: "{% trans 'الرجاء إدخال رقم الهاتف' %}",
        codeSent: "{% trans 'تم إرسال كود التحقق' %}",
        codeSentToPhone: "{% trans 'تم إرسال الكود إلى هاتفك' %}",
        invalidPhoneNumber: "{% trans 'رقم الهاتف غير صحيح' %}",
        enterSixDigits: "{% trans 'الرجاء إدخال كود التحقق المكون من 6 أرقام' %}",
        resendCodeFirst: "{% trans 'يرجى إعادة إرسال الكود' %}",
        wrongCode: "{% trans 'كود التحقق غير صحيح' %}",
        tooManyRequestsShort: "{% trans 'لقد تجاوزت الحد المسموح' %}",
        genericError: "{% trans 'حدث خطأ. يرجى المحاولة مرة أخرى' %}",
    };

    TaminiGoogleAuth.init(
        document.getElementById('login-google-auth'),
        {
            loginUrl: "{% url 'accounts:firebase_session_login' %}",
            successRedirect: "{% url 'accounts:login_success' %}",
            buttonText: "{% trans 'الدخول عبر Google' %}",
            i18n: {
                linkIntro: "{% trans 'البريد %(email)s مسجل لدينا بكلمة مرور. أدخل كلمة المرور لربطه بحساب Google:' %}",
                passwordPlaceholder: "{% trans 'كلمة المرور' %}",
                enterPassword: "{% trans 'الرجاء إدخال كلمة المرور' %}",
                linkButton: "{% trans 'ربط الحساب والمتابعة' %}",
                wrongPassword: "{% trans 'كلمة المرور غير صحيحة' %}",
                genericError: "{% trans 'حدث خطأ. يرجى المحاولة مرة أخرى' %}",
                closedPopup: "{% trans 'تم إغلاق النافذة قبل إكمال الدخول' %}",
                notAllowed: "{% trans 'تسجيل الدخول عبر Google غير مفعّل في لوحة Firebase' %}",
                badDomain: "{% trans 'هذا النطاق غير مصرح به في Firebase' %}",
                blockedPopup: "{% trans 'المتصفح منع النافذة المنبثقة. اسمح بها وحاول مجدداً' %}",
                usePhoneTab: "{% trans 'هذا البريد مرتبط بحساب هاتف. سجّل الدخول من تبويب «رقم الهاتف».' %}",
            },
        }
    );

    var phoneInited = false, emailInited = false;

    function switchLoginTab(which) {
        var emailPanel = document.getElementById('panel-email');
        var phonePanel = document.getElementById('panel-phone');
        var emailTab   = document.getElementById('tab-email');
        var phoneTab   = document.getElementById('tab-phone');

        if (which === 'email') {
            emailPanel.classList.remove('hidden');
            phonePanel.classList.add('hidden');
            emailTab.style.borderColor = '#ea580c';
            emailTab.style.color = '#ea580c';
            phoneTab.style.borderColor = 'transparent';
            phoneTab.style.color = '#9ca3af';
            if (!emailInited) {
                emailInited = true;
                TaminiEmailAuth.initLogin(
                    document.getElementById('login-email-auth'),
                    { loginUrl: "{% url 'accounts:firebase_session_login' %}", successRedirect: "{% url 'accounts:login_success' %}", i18n: T_EMAIL }
                );
            }
        } else {
            emailPanel.classList.add('hidden');
            phonePanel.classList.remove('hidden');
            phoneTab.style.borderColor = '#ea580c';
            phoneTab.style.color = '#ea580c';
            emailTab.style.borderColor = 'transparent';
            emailTab.style.color = '#9ca3af';
            if (!phoneInited) {
                phoneInited = true;
                TaminiPhoneAuth.init({
                    container: document.getElementById('login-phone-auth'),
                    loginUrl: "{% url 'accounts:firebase_session_login' %}",
                    successRedirect: "{% url 'accounts:login_success' %}",
                    sendButtonText: "{% trans 'إرسال كود التحقق' %}",
                    verifyButtonText: "{% trans 'دخول' %}",
                    phonePlaceholder: '+963 9XX XXX XXX',
                    i18n: T_PHONE,
                });
            }
        }
    }
    window.switchLoginTab = switchLoginTab;

    // auto-init email tab
    switchLoginTab('email');
})();
</script>
{% endblock %}
